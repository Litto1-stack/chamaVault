{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-heading"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to ChamaVault</h1><p class="muted">Your chama’s shared record is ready when you are.</p></div>
  <form method="post" class="auth-form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next_url }}">
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn block" type="submit">Sign in</button>
    <p class="auth-switch">New to ChamaVault? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
