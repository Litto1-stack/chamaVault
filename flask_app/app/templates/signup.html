{% extends "base.html" %}
{% block title %}Create your chama{% endblock %}
{% block content %}
<section class="auth-shell auth-wide">
  <div class="auth-heading"><p class="eyebrow">START SAVING TOGETHER</p><h1>Create your account</h1><p class="muted">Set up your chama and invite members when you’re ready.</p></div>
  <form method="post" class="auth-form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Your full name</label><input id="name" name="name" maxlength="80" autocomplete="name" required>
    <div class="form-pair"><div><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="120" autocomplete="email" required></div><div><label for="phone">Kenyan phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="0712 345 678" required></div></div>
    <label for="chama_name">Chama name</label><input id="chama_name" name="chama_name" maxlength="80" placeholder="e.g. Umoja Sisters" required>
    <div class="form-pair"><div><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><div><label for="password_confirm">Confirm password</label><input id="password_confirm" name="password_confirm" type="password" minlength="8" autocomplete="new-password" required></div></div>
    <div class="form-pair"><div><label for="pin">Transaction PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="new-password" required><small>Four digits, used for sensitive group actions.</small></div><div><label for="pin_confirm">Confirm PIN</label><input id="pin_confirm" name="pin_confirm" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="new-password" required></div></div>
    <button class="btn block" type="submit">Create account and chama</button>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </form>
</section>
{% endblock %}
